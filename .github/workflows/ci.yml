name: CI

on:
  # Only the default branch runs on push. Everything else is covered by the
  # pull_request event, so a commit on a branch with an open PR is not built
  # twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is the whole data layer, so the runtime floor is real.
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the client
        run: npm run build

      - name: Boot the platform and smoke every GET route
        # Exercises migrations, seeding, all read routes and the time machine
        # against a real in-process app — the check that catches what unit
        # tests miss.
        run: npx tsx scripts/verify.ts
